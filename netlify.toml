# Netlify configuration for the CAHEN studio site.
# Docs: https://docs.netlify.com/build/configure-builds/file-based-configuration/
#
# The site is a static Vite build plus two serverless functions:
#   admin         – /api/* and /media/* (content, orders, uploads, sessions)
#   retry-orders  – hourly sweep that re-sends queued SMS notifications
#
# Everything stateful lives in Netlify Blobs (ADMIN_BLOB_STORE, default
# "cahen-admin"), so deploys never overwrite content, orders or uploads.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 needs Node 22.12+ and the functions runtime follows the build
  # runtime unless AWS_LAMBDA_JS_RUNTIME overrides it.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# --- API and uploaded media -------------------------------------------------
# Both prefixes are rewrites (status 200) to one function. The function receives
# the rewritten URL and `normaliseFunctionPath` maps it back to /api/... or
# /media/... . `force` keeps these rules ahead of any static file with the same
# name.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/admin/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "/.netlify/functions/admin/media/:splat"
  status = 200
  force = true

# --- Single-page app --------------------------------------------------------
# The control room lives at its own path; everything else falls back to the
# Vite entry document. Static assets are not shadowed by these rules.
[[redirects]]
  from = "/shenataisoni"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/shenataisoni/*"
  to = "/index.html"
  status = 200
  force = true

# A missing static asset is a 404, not the site shell.
#
# These two rules must NOT be forced. Netlify only lets a rule win over a real
# file when `force = true`, and a forced catch-all here rewrote every request
# under /assets and /fonts to /404.html — the stylesheet, the entry script and
# both typefaces came back as text/html with a 404, which is a black page.
# Without `force` a file that exists is always served as itself, and the rule
# only catches genuinely missing paths.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/fonts/*"
  to = "/404.html"
  status = 404

# A missing *file* must never be answered with the app shell. Without these, a
# broken image or a renamed script fell through to the SPA catch-all and came
# back as `200 text/html` — a silent failure that only shows up as a blank box.
# Like the rules above they are unforced, so a real file always wins; Netlify
# matches `*` anywhere in the pattern, so one rule covers every directory.
[[redirects]]
  from = "/*.js"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.css"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.woff2"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.png"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.jpg"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.webp"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.svg"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.mp4"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.wasm"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Headers for static responses ------------------------------------------
# Netlify does not apply these to function responses; the function sets its own
# security headers in server/admin-api.mjs.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # script-src keeps no 'unsafe-inline'. The only inline <script> in the shell
    # is the JSON-LD block, so it is allowed by its exact hash instead of by a
    # blanket policy. Any other inline script from any origin stays refused.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-l+OfQPH6NTO4fyZQd9ZnHwXg+QuxsKlDeVMfiJS8p20=' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Self-hosted typefaces; the file names carry a ?v= tag, so a year is safe.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Vite fingerprints every asset in /assets, so they are safe to cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The hero's height map is not fingerprinted, so it gets a short, revalidated
# cache: a repeat visit costs no request at all, and a replaced texture is live
# within a day. It is preloaded on every page load, so this is the one asset
# whose cache policy is worth stating explicitly.
[[headers]]
  for = "/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The HTML shell must be revalidated so new deploys are picked up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/shenataisoni"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
