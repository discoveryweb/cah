# Netlify configuration for the CAHEN studio site.
# Docs: https://docs.netlify.com/build/configure-builds/file-based-configuration/
#
# The site is a static Vite build plus two serverless functions:
#   admin         – /api/* and /media/* (content, orders, uploads, sessions)
#   retry-orders  – hourly sweep that re-sends queued SMS notifications
#
# Everything stateful lives in Netlify Blobs (ADMIN_BLOB_STORE, default
# "cahen-admin"), so deploys never overwrite content, orders or uploads.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 needs Node 22.12+ and the functions runtime follows the build
  # runtime unless AWS_LAMBDA_JS_RUNTIME overrides it.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# --- API and uploaded media -------------------------------------------------
# Both prefixes are rewrites (status 200) to one function. The function receives
# the rewritten URL and `normaliseFunctionPath` maps it back to /api/... or
# /media/... . `force` keeps these rules ahead of any static file with the same
# name.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/admin/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "/.netlify/functions/admin/media/:splat"
  status = 200
  force = true

# --- Single-page app --------------------------------------------------------
# The control room lives at its own path; everything else falls back to the
# Vite entry document. Static assets are not shadowed by these rules.
[[redirects]]
  from = "/shenataisoni"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/shenataisoni/*"
  to = "/index.html"
  status = 200
  force = true

# A missing static asset is a 404, not the site shell.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/fonts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Headers for static responses ------------------------------------------
# Netlify does not apply these to function responses; the function sets its own
# security headers in server/admin-api.mjs.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Self-hosted typefaces; the file names carry a ?v= tag, so a year is safe.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Vite fingerprints every asset in /assets, so they are safe to cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The hero film is not fingerprinted, so it gets a short, revalidated cache:
# fast repeat visits, and a replaced film is live within minutes. Scrubbing needs
# byte ranges, and the file is served compressed only if the CDN supports it.
[[headers]]
  for = "/film/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    Accept-Ranges = "bytes"

# The HTML shell must be revalidated so new deploys are picked up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/shenataisoni"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
