<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a1e" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, follow" />
    <title>صفحه پیدا نشد — CAHEN</title>
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      @font-face {
        font-family: "Estedad Variable";
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url("/fonts/estedad-arabic.woff2?v=1") format("woff2-variations");
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 100svh;
        padding: clamp(20px, 5vw, 56px);
        background:
          radial-gradient(ellipse at 78% 12%, rgba(96, 58, 200, 0.22), transparent 58%),
          radial-gradient(ellipse at 12% 90%, rgba(129, 84, 246, 0.16), transparent 52%),
          #0a0a1e;
        color: #f6f4ff;
        font-family: "Estedad Variable", Tahoma, sans-serif;
        line-height: 1.9;
        -webkit-font-smoothing: antialiased;
      }
      main { display: grid; align-content: center; gap: clamp(18px, 3vw, 30px); max-width: 760px; }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: rgba(211, 188, 255, 0.72);
        font-size: 9px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .eyebrow::before { width: 26px; height: 1px; background: currentColor; content: ""; }
      .code {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: clamp(4.5rem, 18vw, 9rem);
        line-height: 0.9;
        letter-spacing: -0.02em;
        color: #a77aff;
      }
      h1 { margin: 0; font-size: clamp(1.6rem, 5.4vw, 2.6rem); font-weight: 700; letter-spacing: -0.02em; }
      p { margin: 0; max-width: 46ch; color: rgba(246, 244, 255, 0.68); font-size: 15px; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px 18px; margin-top: 6px; }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        gap: 10px;
        padding-inline: 22px;
        border-radius: 14px;
        color: inherit;
        font-size: 13.5px;
        text-decoration: none;
        transition: transform 180ms ease, filter 180ms ease, border-color 200ms ease;
      }
      a:active { transform: scale(0.98); }
      .primary {
        border: 1px solid rgba(199, 169, 255, 0.34);
        background: linear-gradient(110deg, #7040f0, #9a5cff);
        box-shadow: 0 18px 40px -22px rgba(129, 84, 246, 0.95);
      }
      .secondary { border: 1px solid rgba(190, 176, 255, 0.28); color: rgba(246, 244, 255, 0.8); }
      .secondary:hover { border-color: rgba(190, 176, 255, 0.5); }
      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        justify-content: space-between;
        padding-top: 22px;
        border-top: 1px solid rgba(190, 176, 255, 0.14);
        color: rgba(246, 244, 255, 0.44);
        font-size: 10px;
        letter-spacing: 0.14em;
      }
      footer a { min-height: 0; padding: 0; font-size: inherit; color: inherit; text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">Error 404 — CAHEN STUDIO</span>
      <span class="code" aria-hidden="true">۴۰۴</span>
      <h1>این صفحه پیدا نشد.</h1>
      <p>
        نشانی‌ای که باز کرده‌اید وجود ندارد یا جابه‌جا شده است. از ابتدای سایت ادامه بدهید؛
        کارها، توانمندی‌ها و راه تماس همان‌جا هستند.
      </p>
      <div class="actions">
        <a class="primary" href="/">بازگشت به خانه</a>
        <a class="secondary" href="/#work">دیدن کارها</a>
        <a class="secondary" href="mailto:info@cahen.ir">info@cahen.ir</a>
      </div>
    </main>
    <footer>
      <span dir="ltr">CAHEN © 2026</span>
      <span>تهران — استودیوی طراحی و توسعه</span>
    </footer>
  </body>
</html>
